<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Fastfood</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Colores de marca -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Menú de navegación (lo pinta js/script.js) -->
    <header id="navbar-ff"></header>

    <main>
        <section class="bg-body-secondary py-5 text-center">
            <div class="container">
                <h1 class="fw-bold">Contáctanos</h1>
                <p class="text-secondary mb-0">Estamos disponibles para atender tus inquietudes.</p>
            </div>
        </section>

        <section class="container py-5">
            <div class="row g-5">
                <div class="col-md-5">
                    <h2 class="fw-bold h3">Información de contacto</h2>
                    <p><strong>Restaurante:</strong> Fastfood</p>
                    <p><strong>Ubicación:</strong> Mocoa, Putumayo</p>
                    <p><strong>Correo:</strong> contacto@fastfood.com</p>
                    <p><strong>Teléfono:</strong> 300 000 0000</p>
                    <p><strong>Horario:</strong> Lun–Dom · 11am–10pm</p>
                    <div class="ratio ratio-16x9 mt-3 rounded-3 overflow-hidden">
                        <iframe src="https://www.google.com/maps?q=Mocoa,Putumayo&output=embed" loading="lazy" title="Ubicación de Fastfood en Mocoa"></iframe>
                    </div>
                </div>
                <div class="col-md-7">
                    <h2 class="fw-bold h3">Envíanos un mensaje</h2>
                    <form id="formContacto" novalidate>
                        <div class="mb-3"><label for="nombre" class="form-label">Nombre completo</label><input type="text" class="form-control" id="nombre" placeholder="Escribe tu nombre" required></div>
                        <div class="mb-3"><label for="correo" class="form-label">Correo electrónico</label><input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.com" required></div>
                        <div class="mb-3"><label for="asunto" class="form-label">Asunto</label>
                            <select id="asunto" class="form-select"><option>Consulta</option><option>Reclamo</option><option>Eventos privados</option></select></div>
                        <div class="mb-3"><label for="mensaje" class="form-label">Mensaje</label><textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe tu mensaje" required></textarea></div>
                        <button type="submit" class="btn btn-primary">Enviar mensaje</button>
                    </form>
                    <div id="msgContacto"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Pie de página (lo pinta js/script.js) -->
    <footer id="footer-ff"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
