<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas | Fastfood</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Colores de marca -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Menú de navegación (lo pinta js/script.js) -->
    <header id="navbar-ff"></header>

    <main>
        <section class="bg-body-secondary py-5 text-center">
            <div class="container">
                <h1 class="fw-bold">Reserva tu mesa</h1>
                <p class="text-secondary mb-0">Elige fecha, hora y número de personas. Atendemos de lunes a domingo, de 11am a 10pm.</p>
            </div>
        </section>

        <section class="container py-5">
            <div class="row g-5">
                <div class="col-lg-6">
                    <h2 class="h4 fw-bold mb-3">Datos de la reserva</h2>
                    <form id="formReserva" class="needs-validation" novalidate>
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label" for="fecha">Fecha</label><input type="date" id="fecha" class="form-control" required></div>
                            <div class="col-md-6"><label class="form-label" for="hora">Hora</label><input type="time" id="hora" class="form-control" min="11:00" max="21:30" required></div>
                            <div class="col-md-6"><label class="form-label" for="personas">Número de personas</label><input type="number" id="personas" class="form-control" min="1" max="12" required></div>
                            <div class="col-md-6"><label class="form-label" for="telefono">Teléfono</label><input type="tel" id="telefono" class="form-control" required></div>
                            <div class="col-12"><label class="form-label" for="nombreReserva">Nombre completo</label><input type="text" id="nombreReserva" class="form-control" required></div>
                            <div class="col-12"><label class="form-label" for="notasReserva">Observaciones (opcional)</label><textarea id="notasReserva" class="form-control" rows="2" placeholder="Cumpleaños, silla para bebé…"></textarea></div>
                            <div class="col-12"><button type="submit" class="btn btn-primary">Confirmar reserva</button></div>
                        </div>
                    </form>
                    <div id="mensajeReserva"></div>
                </div>
                <div class="col-lg-6">
                    <h2 class="h4 fw-bold mb-3">Disponibilidad de mesas</h2>
                    <div class="row g-2" id="mesasDisp"></div>
                    <p class="small text-secondary mt-3">Verde: libre · Amarillo: reservada · Rojo: ocupada.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Pie de página (lo pinta js/script.js) -->
    <footer id="footer-ff"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
