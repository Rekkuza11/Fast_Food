<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú | Fastfood</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Colores de marca -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Menú de navegación (lo pinta js/script.js) -->
    <header id="navbar-ff"></header>

    <main>
        <section class="bg-body-secondary py-5 text-center">
            <div class="container">
                <h1 class="fw-bold">Nuestro menú</h1>
                <p class="text-secondary mb-0">Elige tus platos favoritos y arma tu pedido.</p>
            </div>
        </section>

        <section class="container py-5">
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <input type="search" id="buscador" class="form-control" placeholder="Buscar plato…" aria-label="Buscar plato">
                </div>
                <div class="col-md-6 d-flex flex-wrap gap-2" id="filtros">
                    <button class="btn btn-sm btn-dark" data-cat="todas">Todas</button>
                    <button class="btn btn-sm btn-outline-dark" data-cat="entradas">Entradas</button>
                    <button class="btn btn-sm btn-outline-dark" data-cat="fuertes">Fuertes</button>
                    <button class="btn btn-sm btn-outline-dark" data-cat="postres">Postres</button>
                    <button class="btn btn-sm btn-outline-dark" data-cat="bebidas">Bebidas</button>
                </div>
            </div>
            <div class="row g-4" id="listaPlatos"></div>
        </section>
    </main>

    <!-- Pie de página (lo pinta js/script.js) -->
    <footer id="footer-ff"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
