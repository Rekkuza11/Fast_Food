<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu pedido | Fastfood</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Colores de marca -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Menú de navegación (lo pinta js/script.js) -->
    <header id="navbar-ff"></header>

    <main>
        <section class="bg-body-secondary py-5 text-center">
            <div class="container">
                <h1 class="fw-bold">Tu pedido</h1>
                <p class="text-secondary mb-0">Revisa los platos, agrega notas para cocina y confirma.</p>
            </div>
        </section>

        <section class="container py-5">
            <div class="row g-4">
                <div class="col-lg-8"><div id="itemsCarrito"></div></div>
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm p-4">
                        <h2 class="h5 fw-bold">Resumen</h2>
                        <p class="d-flex justify-content-between"><span>Subtotal</span><strong id="subtotal">$0</strong></p>
                        <label class="form-label" for="tipoPedido">Tipo de pedido</label>
                        <select id="tipoPedido" class="form-select mb-3">
                            <option>En el restaurante (mesa)</option>
                            <option>Para llevar</option>
                            <option>Domicilio</option>
                        </select>
                        <label class="form-label" for="notasPedido">Notas para cocina</label>
                        <textarea id="notasPedido" class="form-control mb-3" rows="2" placeholder="Sin cebolla, término medio…"></textarea>
                        <button id="btnConfirmar" class="btn btn-primary w-100">Confirmar pedido</button>
                        <div id="resultadoPedido"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Pie de página (lo pinta js/script.js) -->
    <footer id="footer-ff"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
